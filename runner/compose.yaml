services:
  runner:
    build:
      context: .
    env_file:
      - .env
    environment:
      RUNNER_BROWSER_PROFILE_DIR: /data/browser-profile
    volumes:
      - signal-apply-browser:/data/browser-profile
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    shm_size: 1gb

volumes:
  signal-apply-browser:
